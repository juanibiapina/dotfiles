name: "Build mini system"

on:
  push:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "accept-flake-config = true"

      - name: "Build mini configuration"
        run: "nix build --no-update-lock-file .#nixosConfigurations.mini.config.system.build.toplevel"

      - name: "Check Android development shell"
        run: |
          nix develop --no-update-lock-file .#android --command bash -euo pipefail -c '
            java -version
            node --version
            test "$ANDROID_HOME" = "$ANDROID_SDK_ROOT"
            test "$ANDROID_NDK_ROOT" = "$ANDROID_SDK_ROOT/ndk/27.1.12297006"
            for sdk_path in platforms/android-36 platforms/android-35 build-tools/36.0.0 build-tools/35.0.0 ndk/27.1.12297006 ndk/27.0.12077973 cmake/3.22.1; do
              test -d "$ANDROID_SDK_ROOT/$sdk_path"
            done
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" version
            case "$GRADLE_OPTS" in
              *"-Dorg.gradle.project.android.aapt2FromMavenOverride=$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"*) ;;
              *) exit 1 ;;
            esac
          '
