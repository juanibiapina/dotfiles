quitOnEsc: true
defaults:
  view: notifications
keybindings:
  universal:
    - key: J
      builtin: pageDown
    - key: K
      builtin: pageUp
theme:
  ui:
    table:
      showSeparator: false
      compact: true
  colors:
    text:
      primary: "#c8d3f5"
      secondary: "#82aaff"
      inverted: "#222436"
      faint: "#636da6"
      warning: "#ff757f"
      success: "#c3e88d"
      actor: "#c099ff"
    background:
      selected: "#2f334d"
    border:
      primary: "#3b4261"
      secondary: "#3b4261"
      faint: "#2f334d"
    icon:
      newContributor: "#c3e88d"
      contributor: "#82aaff"
      collaborator: "#ffc777"
      member: "#ffc777"
      owner: "#ff966c"
      unknownRole: "#636da6"
