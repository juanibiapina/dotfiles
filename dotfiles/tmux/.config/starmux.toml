modules = ["sessions", "divider", "pi-workbench", "divider", "pi-context", "divider", "gob", "spacer", "divider", "top", "divider", "git", "divider", "usage", "blank"]
colorscheme = "tokyo-night"

[sessions]
session_format = "[ $name ]($style)"
window_format = "[ $index ]($style)$indicator[ $name]($style)"

[sessions.window_options]
icon = "@window_icon"
state = "@pi_win_state"

[sessions.indicator]
source = "icon"
fallback = "|"
style = "$style"

[[sessions.indicator.rules]]
when = { state = "working" }
text = "●"
style = "fg=warning"

[[sessions.indicator.rules]]
when = { state = "notify" }
text = "●"
style = "fg=accent"

[divider]
character = "─"

[git]
lines = [
  " ⎇ $branch( $upstream)( $divergence)",
  " ( $conflicts)( $staged)( $modified)( $untracked)( $stash)( $added)( $deleted)( $clean)",
  " ( $state)",
]

[pi-context]
open_command = ["dev", "tmux", "edit", "{file}", "{pane}", "{socket}"]

[usage]
providers = ["codex"]

[actions.monitor]
argv = ["tmux", "-S", "{socket}", "new-window", "-t", "{session}:", "-c", "{path}", "htop"]

[actions.jobs]
argv = ["tmux", "-S", "{socket}", "switch-client", "-c", "{client}", "-t", "{session}:4"]

[[clicks]]
module = "top"
match = { kind = "metric" }
action = "monitor"

[[clicks]]
module = "gob"
match = { kind = "job" }
action = "jobs"

[actions.git]
argv = ["tmux", "-S", "{socket}", "switch-client", "-c", "{client}", "-t", "{session}:3"]

[[clicks]]
module = "git"
action = "git"
