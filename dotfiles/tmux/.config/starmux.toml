modules = ["pi-workbench", "divider", "pi-context", "divider", "gob", "spacer", "divider", "top", "divider", "git", "divider", "usage", "blank"]
colorscheme = "tokyo-night"

[slim]
mode = "auto"
show_windows = false

[pi-workbench]
project_style = "fg=muted,nobold"

[divider]
character = "─"

[git]
lines = [
  " ⎇ $branch( $upstream)( $divergence)",
  " ( $conflicts)( $staged)( $modified)( $untracked)( $stash)( $added)( $deleted)( $clean)",
  " ( $state)",
]

[pi-context]
plan_server_url = "http://127.0.0.1:19433"
open_command = ["dev", "tmux", "edit", "{file}", "{pane}", "{socket}"]

[usage]
providers = ["codex"]

[actions.monitor]
argv = ["tmux", "-S", "{socket}", "new-window", "-t", "{session}:", "-c", "{path}", "htop"]

[actions.jobs]
argv = ["tmux", "-S", "{socket}", "switch-client", "-c", "{client}", "-t", "{session}:4"]

[[clicks]]
module = "top"
match = { kind = "metric" }
action = "monitor"

[[clicks]]
module = "gob"
match = { kind = "job" }
action = "jobs"

[actions.git]
argv = ["tmux", "-S", "{socket}", "switch-client", "-c", "{client}", "-t", "{session}:3"]

[[clicks]]
module = "git"
action = "git"
