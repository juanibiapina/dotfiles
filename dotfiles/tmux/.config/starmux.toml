modules = ["sessions", "divider", "pi-workbench", "divider", "pi-context", "divider", "gob", "spacer", "divider", "git", "divider", "usage", "blank"]
colorscheme = "tokyo-night"

[sessions]
session_format = "[ $name ]($style)"
window_format = "[ $index ]($style)$indicator[ $name]($style)"

[sessions.window_options]
icon = "@window_icon"
state = "@pi_win_state"

[sessions.indicator]
source = "icon"
fallback = "|"
style = "$style"

[[sessions.indicator.rules]]
when = { state = "working" }
text = "●"
style = "fg=warning"

[[sessions.indicator.rules]]
when = { state = "notify" }
text = "●"
style = "fg=accent"

[divider]
character = "─"

[git]
lines = [
  " ⎇ $branch( $upstream)( $divergence)",
  " ( $conflicts)( $staged)( $modified)( $untracked)( $stash)( $added)( $deleted)( $clean)",
  " ( $state)",
]

[pi-context]
open_command = ["dev", "tmux", "edit", "{file}", "{pane}", "{socket}"]

[usage]
providers = ["codex"]
