# set terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# set vi mode
set-window-option -g mode-keys vi

# Fix escape key delay
set -sg escape-time 0

# Increase history limit
set -g history-limit 50000

# Increase time to display messages
set -g display-time 2000

# enable focus events
set -g focus-events on

# Enable pane scrolling, selection, resizing, and status-bar clicks.
set -g mouse on

# Stay in copy mode after a mouse selection.
# The default binding is copy-pipe-and-cancel, which exits copy mode on mouse
# release and snaps the view back to the bottom. That interrupts reading: select
# a line while scrolled up and the scrollback position is lost. copy-pipe copies
# to the clipboard the same way but keeps the mode and the scroll position.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe

# Double-click a URL to open it.
#
# The terminal cannot do this. tmux paints panes row by row, so a URL wider than
# the pane reaches the terminal as two unrelated lines and any terminal-side
# click (Ghostty cmd+shift+click) truncates it. Only tmux knows the rows are one
# logical line: #{mouse_word} follows GRID_LINE_WRAPPED across the wrap.
#
# #{mouse_word} splits on `word-separators`, which by default contains : / and .
# and so returns "github" rather than the URL. Narrowing it globally would make
# every double-click select whole whitespace-delimited tokens, so instead it is
# narrowed for the duration of the binding and restored before the normal
# select-word fallback runs. #{mouse_word} reads the global option at evaluation
# time, so the temporary value applies.
#
# OSC 8 hyperlinks are checked first: exact, and immune to wrapping.
bind -n DoubleClick1Pane {
  select-pane -t=
  if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send -M
  } {
    set -g word-separators " "
    if -F '#{mouse_hyperlink}' {
      set -gu word-separators
      run -b "dev tmux open-link #{q:mouse_hyperlink}"
    } {
      if -F '#{m:*://*,#{mouse_word}}' {
        run -b "dev tmux open-link #{q:mouse_word}"
        set -gu word-separators
      } {
        set -gu word-separators
        copy-mode -H
        send -X select-word
        run -d0.3
        send -X copy-pipe-and-cancel
      }
    }
  }
}

# Enable extended keys for modified key sequences
set -g extended-keys on
set -g extended-keys-format csi-u

# Set the prefix to Control Space
unbind C-b
set -g prefix C-Space

# Alternate to last window (same key as prefix)
bind Space last-window

# Automatically set window names
#set -g automatic-rename on
#set -g automatic-rename-format "#I#{pane_current_command}"

# Create new window
unbind ^C
bind ^C new-window
unbind c
bind c new-window

# Rename window
unbind A
bind A command-prompt "rename-window %%"

# Make first window be 1
set -g base-index 1

# Activity monitoring: highlight window with new messages
setw -g monitor-activity on

set -g detach-on-destroy off

# Splits
unbind %
bind v split-window -h
bind V split-window -v
bind i split-window -h \; send-keys 'eval $CODING_AGENT' Enter

# Pane traversal (vim-style)
bind h select-pane -L
bind j select-pane -D
bind K select-pane -U
bind l select-pane -R

# Window traversal (explicit defaults)
bind n next-window
bind p previous-window

## Status line

# refresh 'status-left' and 'status-right' more often
set -g status-interval 5

set -g status-left-length 32
set -g status-left '[#S]'

# Sessions
bind ( switch-client -p
bind ) switch-client -n
bind L switch-client -l
unbind S
bind S choose-session -N

# Switch sessions with dev
unbind s
bind s run-shell -b "dev tmux switch"

# Send current tab to runner session
bind r run-shell -b "tmux move-window -s $(tmux display-message -p '#S') -t runner"

# Open URLs with dev open-url
unbind u
bind u run-shell -b "dev tmux open-url"

# Open current repository (or its PR) on GitHub
unbind g
bind g run-shell -b "dev tmux browse"

# Push current repository
unbind P
bind P run-shell -b "dev tmux push"

# Send notification after currently running command ends
bind-key M run-shell "kill -s USR1 -- #{pane_pid}"

# Send "commit" message to current pane
bind-key C run-shell -b 'tmux send-keys -l "commit" && sleep 0.05 && tmux send-keys Enter'

# Show keybindings in fzf popup
bind-key ? display-popup -E -w 80% -h 80% "tmux list-keys -Na | fzf --reverse"

# Command launcher
bind-key k run-shell -b "dev tmux launcher"

# Pi artifacts of the current project, opens the selection in the editor
bind-key e run-shell -b "dev artifacts browse '#{pane_current_path}'"

# Ticket manager TUI
unbind t
bind t display-popup -E -w 80% -h 80% "todo tui"



# Open new dev session
unbind N
bind N run-shell -b "dev tmux open"

# Kill current session without detaching
unbind X
bind X kill-session

# Pi agent notifications
bind a run-shell -b "dev tmux notify-switch"

# Hooks
set-hook -g after-split-window 'select-layout -E'
set-hook -g pane-exited 'select-layout -E'
set-hook -g after-kill-pane 'select-layout -E'
set-hook -g client-session-changed 'run-shell -b "dev tmux notify-clear"'

# =============================================================================
# Tokyo Night Color Scheme
# =============================================================================

set -g @theme_bg "#1e2030"
set -g @theme_bg_dark "#1b1d2b"
set -g @theme_fg "#82aaff"
set -g @theme_fg_dim "#828bb8"
set -g @theme_border "#3b4261"

# Theme palette (tmux 3.8+, server-scope options, hence `set -s`)
#
# Since 3.8 tmux resolves ten named colours (themeblack, themewhite,
# themelightgrey, themedarkgrey, themegreen, themeyellow, themered, themeblue,
# themecyan, thememagenta) through the dark-theme-* / light-theme-* options,
# and 24 built-in defaults are written in terms of them. This file styles 6 of
# those explicitly further down; the other 18 take their colours from here:
# menus, popups, copy-mode match/mark/line-number styles, pane scrollbars,
# display-panes, clock mode, fill-character and tree mode.
#
# Why `theme dark` rather than the default `detect`: detect follows the
# terminal's DSR 996 reply, and Ghostty reports the macOS system appearance
# instead of its own background, so a dark terminal under a light system is
# told "light" and those 18 options turn grey-on-white. Pinning ignores the
# report, which also keeps this correct over SSH and in terminals that report
# nothing at all.
#
# Why the values are pinned too: the built-in sets are explicitly unstable
# upstream ("based these on emacs but they could change", tmux 8c55a388).
# Setting them from the @theme_* variables above keeps the colours ours. The
# values are format-expanded, which is what makes #{@theme_*} work here.
#
# light-theme-* is deliberately left at its defaults: it is unreachable while
# theme is pinned to dark. Setting theme back to detect would expose tmux's
# grey light palette, so pin those too if that ever changes.
#
# Written against tmux next-3.8 (flake input tmux-src at ff214cf9).
# MAINTENANCE: after `nix flake update tmux-src`, run `dev tmux theme-check`.
# A theme colour added upstream would silently fall back to tmux's built-in
# value instead of Tokyo Night. The check does not cover semantic changes to
# existing colours, so also skim the theme entries in tmux's CHANGES.
set -s theme dark
set -s dark-theme-black      "#{@theme_bg_dark}"
set -s dark-theme-dark-grey  "#{@theme_bg}"
set -s dark-theme-light-grey "#{@theme_fg_dim}"
set -s dark-theme-white      "colour15"
# accents track the terminal palette rather than repeating hex values here
set -s dark-theme-red        "colour1"
set -s dark-theme-green      "colour2"
set -s dark-theme-yellow     "colour3"
set -s dark-theme-blue       "colour4"
set -s dark-theme-magenta    "colour5"
set -s dark-theme-cyan       "colour6"

# =============================================================================
# Theme Structure
# =============================================================================

# default statusbar colors
set -g status-style "fg=#{@theme_fg},bg=#{@theme_bg}"

# default window title colors
# NOTE: window-status-format and -current-format below contain Powerline glyphs
# (U+E0B0, private-use area). They render invisibly. Edit at byte level
# (sed/cat) to avoid silently dropping them.
setw -g window-status-style "NONE,fg=#{@theme_fg_dim},bg=#{@theme_bg}"
setw -g window-status-format "#[fg=#{@theme_bg},bg=#{@theme_bg},nobold,nounderscore,noitalics]#[default] #I:#W#[fg=#{@theme_bg},bg=#{@theme_bg},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#{@theme_bg},bg=#{@theme_border},nobold,nounderscore,noitalics]#[fg=#{@theme_fg},bg=#{@theme_border}] #I:#W#[fg=#{@theme_border},bg=#{@theme_bg},nobold,nounderscore,noitalics]"
setw -g window-status-activity-style "fg=#{@theme_fg_dim},bg=#{@theme_bg}"

# pane border
set -g pane-border-style "fg=#{@theme_border}"
set -g pane-active-border-style "fg=#{@theme_fg}"

# message text
set -g message-style "fg=#{@theme_fg},bg=#{@theme_border}"
set -g message-command-style "fg=#{@theme_fg},bg=#{@theme_border}"

# pane number display
#set-option -g display-panes-active-colour blue
#set-option -g display-panes-colour brightred

# other stuff
set -g mode-style "fg=#{@theme_fg},bg=#{@theme_border}"
setw -g window-status-separator ""

# NOTE: status-left and status-right below contain Powerline glyphs
# (U+E0B0/U+E0B2, private-use area). They render invisibly. Edit at byte level
# (sed/cat) to avoid silently dropping them.
set -g status-left "#[fg=#{@theme_bg_dark},bg=#{@theme_fg},bold] #S #[fg=#{@theme_fg},bg=#{@theme_bg},nobold,nounderscore,noitalics]"
set -g status-right-length 75
set -g status-right "#[fg=#{@theme_fg},bold]#{?window_zoomed_flag, ⛶ ,}#[fg=yellow,bold]#{?#{@pi_notifications}, ● ,}#[fg=#{@theme_border},bg=#{@theme_bg},nobold,nounderscore,noitalics]#[fg=#{@theme_fg},bg=#{@theme_border}] #(gitmux -cfg ~/.gitmux.conf '#{pane_current_path}')#[fg=#{@theme_bg},bg=#{@theme_border},nobold,nounderscore,noitalics]#[fg=#{@theme_fg},bg=#{@theme_bg},nobold,nounderscore,noitalics]#[fg=#{@theme_bg_dark},bg=#{@theme_fg},bold] #(dev notes tracking) "
