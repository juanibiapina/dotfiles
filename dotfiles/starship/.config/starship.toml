[custom.gitbutler]
when = 'case "$(git symbolic-ref --short -q HEAD)" in gitbutler/*) ;; *) exit 1 ;; esac'
command = "starship-gitbutler"
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
symbol = " "
style = "bold purple"
format = "on [$symbol$output]($style) "
