# starship preset nerd-font-symbols -o ~/.config/starship.toml
# plus disable aws, and show GitButler stacks instead of the gitbutler/* branch
format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch${custom.gitbutler}$all"

