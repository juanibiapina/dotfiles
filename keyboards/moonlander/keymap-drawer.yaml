draw_config:
  svg_extra_style: |
    text { font-family: -apple-system, "SF Pro", "Helvetica Neue", sans-serif; }
    rect.mod { fill: #fcd34d; stroke: #f59e0b; }
    rect.layer { fill: #a5b4fc; stroke: #6366f1; }
    rect.edit { fill: #fca5a5; stroke: #ef4444; }
    rect.num { fill: #86efac; stroke: #22c55e; }
    rect.sym { fill: #bef264; stroke: #84cc16; }
    rect.fn { fill: #d8b4fe; stroke: #a855f7; }
    rect.nav { fill: #7dd3fc; stroke: #0ea5e9; }
    rect.light { fill: #f9a8d4; stroke: #ec4899; }
    rect.play { fill: #5eead4; stroke: #14b8a6; }
    rect.volume { fill: #fdba74; stroke: #f97316; }
    rect.mute { fill: #f87171; stroke: #dc2626; }
    rect.sound { fill: #f0abfc; stroke: #d946ef; }
    rect.boot { fill: #f87171; stroke: #dc2626; }

