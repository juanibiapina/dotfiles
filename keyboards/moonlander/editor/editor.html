<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moonlander layout</title>
<style>
  body {
    margin: 0;
    background: white;
    color: #111;
    font-family: -apple-system, "SF Pro", "Helvetica Neue", sans-serif;
  }
  #toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 30px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
  }
  #selected {
    min-width: 280px;
    color: #475569;
  }
  #keycode {
    width: 220px;
    font: inherit;
    font-family: ui-monospace, monospace;
    padding: 4px 6px;
  }
  #count {
    margin-left: auto;
    color: #475569;
  }
  button {
    font: inherit;
    padding: 4px 10px;
  }
  #report {
    margin: 0;
    padding: 10px 30px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    font-size: 12px;
    white-space: pre-wrap;
  }
  #report:empty {
    display: none;
  }
  #drawing svg {
    user-select: none;
    -webkit-user-select: none;
  }
  #drawing g[class*="keypos-"] {
    cursor: grab;
  }
  #drawing g.ed-changed > rect {
    stroke: #111;
    stroke-width: 2.5;
    stroke-dasharray: 5 3;
  }
  #drawing g.ed-selected > rect,
  #drawing g.ed-drop > rect {
    stroke: #2563eb;
    stroke-width: 3.5;
    stroke-dasharray: none;
  }
  #drawing g.ed-dragging {
    opacity: 0.4;
  }
</style>
</head>
<body>
<div id="toolbar">
  <span id="selected">Click a key to select it, or drag it onto another key to swap them.</span>
  <input id="keycode" list="keycodes" placeholder="Keycode, then Enter" disabled spellcheck="false" autocomplete="off">
  <datalist id="keycodes"></datalist>
  <button id="clear" disabled>Clear</button>
  <span id="count">No changes</span>
  <button id="reset" disabled>Reset</button>
  <button id="copy" disabled>Copy changes</button>
</div>
<pre id="report"></pre>
<div id="drawing">
